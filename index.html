    /***********************
     * Helper: API call
     ***********************/
    async function apiCall(action, method = 'POST', data = null) {
      const url = APP_SCRIPT_BASE + '?action=' + encodeURIComponent(action);
      const options = {
        method: method,
        headers: {
          'Content-Type': 'application/json',
        },
      };
      if (method === 'POST' && data) {
        options.body = JSON.stringify(data);
      } else if (method === 'GET' && data) {
        // For GET, we append parameters to URL (but we use POST for most)
        // We'll handle GET via query string separately.
        // For simplicity, we'll use POST for all API calls that require body.
        // For GET actions, we call apiGet.
      }
      const response = await fetch(url, options);
      if (!response.ok) {
        throw new Error('Network error: ' + response.status);
      }
      return await response.json();
    }

    async function apiGet(action, params = {}) {
      let url = APP_SCRIPT_BASE + '?action=' + encodeURIComponent(action);
      for (const key in params) {
        url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
      }
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error('Network error: ' + response.status);
      }
      return await response.json();
    }

            username: userData.username,

    // window.addEventListener('message', ...) – unchanged except we use apiCall for token creation/verification

    // Update the message handler to use apiCall
    window.addEventListener('message', function(event) {
      try {
        if (!currentApp) return;
        if (!frame || !frame.contentWindow) return;
        if (event.source !== frame.contentWindow) return;
        var originAllowed = getOriginFromUrl(currentApp.url);
        if (originAllowed && event.origin !== originAllowed) {
          console.warn('Message origin mismatch; expected:', originAllowed, 'got:', event.origin);
          return;
        }
        var data = event.data || {};
        if (!data.type) return;
        if (data.type === 'REQUEST_SESSION') {
          sendSessionToFrame(event.source, event.origin);
          return;
        }
        if (data.type === 'VERIFY_TOKEN_REQUEST') {
          var tokenToVerify = (data.token || '').toString();
          var reqId = data.requestId || null;
          apiGet('verifyToken', { token: tokenToVerify, clientId: '' })
            .then(res => {
              safePostMessage(event.source, event.origin, { type: 'VERIFY_TOKEN_RESPONSE', requestId: reqId, result: res });
            })
            .catch(err => {
              safePostMessage(event.source, event.origin, { type: 'VERIFY_TOKEN_RESPONSE', requestId: reqId, error: 'Server error' });
            });
          return;
        }
        if (data.type === 'CREATE_APP_TOKEN') {
          var webappId = data.webappId || currentApp.webappId || null;
          var lifetime = parseInt(data.lifetimeMinutes, 10) || 15;
          var reqId2 = data.requestId || null;
          var s = getSession();
          if (!s || !s.username) {
            safePostMessage(event.source, event.origin, { type: 'CREATE_APP_TOKEN_RESPONSE', requestId: reqId2, success: false, message: 'No session' });
            return;
          }
          apiCall('createLoginToken', 'POST', {
            userid: s.username,
            fullname: s.fullname || s.username,
            role: s.role || '',
            lifetimeMinutes: lifetime,
            webappId: webappId,
            clientId: localStorage.getItem('clientId') || '',
            browserInfo: JSON.stringify({ userAgent: navigator.userAgent })
          })
          .then(tokenRes => {
            safePostMessage(event.source, event.origin, { type: 'CREATE_APP_TOKEN_RESPONSE', requestId: reqId2, result: tokenRes });
          })
          .catch(err => {
            safePostMessage(event.source, event.origin, { type: 'CREATE_APP_TOKEN_RESPONSE', requestId: reqId2, success: false, message: 'Server error creating token' });
          });
          return;
        }
      } catch (e) { console.error('message handler error', e); }
    }, false);

    function doChangePassword() {
      changePassError.textContent = '';
      var np = newPass.value || '';
      var cp = confirmPass.value || '';

      apiCall('changePassword', 'POST', {
        username: pendingForceUser,
        newPassword: np,
        forceChange: false
      })
      .then(async (res) => {
        changePassSubmit.disabled = false; changePassSubmit.textContent = 'Save & Continue';

    // ... loginBtn, loginCancel, loginSubmit, etc. ...

    function attemptLogin() {
      loginError.textContent = '';
      const u = loginUser.value.trim();
      const p = loginPass.value;
      if (!u || !p) {
        loginError.textContent = 'Please enter userid and password.';
        return;
      }
      loginSubmit.disabled = true;
      loginSubmit.textContent = 'Checking…';
      const clientId = localStorage.getItem('clientId') || '';
      const browserInfo = JSON.stringify({
        userAgent: navigator.userAgent,
        screen: `${screen.width}x${screen.height}`,
        language: navigator.language
      });

      apiCall('login', 'POST', {
        username: u,
        password: p,
        clientId: clientId,
        browserInfo: browserInfo
      })
      .then((res) => {
        loginSubmit.disabled = false;
        loginSubmit.textContent = 'LOGIN';
        if (res && res.success) {
          if (res.forceChange) {
            closeLogin();
            openChangePass(res);
            return;
          }

            username: res.username,
            role: res.role,
            fullname: res.fullname,
            loggedAt: Date.now(),
            division: res.division || '',
            status: res.status || '',
            classification: res.classification || ''
          };
          if (res.token) {
            session.token = res.token;
            session.tokenExpiresAt = res.tokenExpiresAt;
          }
          setSession(session);

          // Remember Me

            apiCall('createLoginToken', 'POST', {
              userid: session.username,
              fullname: session.fullname,
              role: session.role,
              lifetimeMinutes: 43200,
              webappId: '',
              clientId: clientId,
              browserInfo: browserInfo
            })
            .then(longTokenRes => {
              if (longTokenRes && longTokenRes.success && longTokenRes.token) {
                session.token = longTokenRes.token;
                session.tokenExpiresAt = longTokenRes.expiresAt;
                setSession(session);
                storePersistentToken(longTokenRes.token, {
                  username: session.username,
                  role: session.role,
                  fullname: session.fullname,
                  tokenExpiresAt: session.tokenExpiresAt,
                  division: session.division,
                  status: session.status,
                  classification: session.classification
                });
              } else {
                storePersistentToken(null, null);
              }
            })
            .catch(() => storePersistentToken(null, null));
          } else {
            storePersistentToken(null, null);
          }

          closeLogin();
          showDisclaimer(() => {
            restoreSessionUI();
            pill.textContent = 'Signed in';
            setTimeout(() => pill.textContent = 'Ready', 1200);
            fetchAndBuildNav(session.username);
            loadHomepage();
            startInactivityMonitoring();
            logUserAction('LOGIN_SUCCESS', '', 'User logged in successfully');
          });

        } else {
          loginError.textContent = res && res.message ? res.message : 'Sign in failed.';
        }
      })
      .catch((err) => {
        console.error('checkLogin failed', err);
        loginSubmit.disabled = false;
        loginSubmit.textContent = 'LOGIN';
        loginError.textContent = 'Server error. Check deployment/executions.';
        pill.textContent = 'Server error';
        setTimeout(() => pill.textContent = 'Ready', 1500);
      });
    }

    /***********************

    function doLogout(silent = false) {
      stopInactivityMonitoring();
      const s = getSession();
      if (s && s.username) {
        logUserAction('LOGOUT', '', 'User signed out');
        if (s.token) {
          apiCall('deleteLoginToken', 'POST', { token: s.token })
            .catch(err => console.warn('deleteLoginToken failed', err));
        }
      }
      clearSession();
      storePersistentToken(null, null);
      restoreSessionUI();
      userMenu.classList.remove('show');
      if (!silent) pill.textContent = 'Signed out';
      setTimeout(()=> { if (!silent) pill.textContent = 'Ready'; }, 1200);
      frame.src = 'about:blank';
      titleEl.textContent = 'Welcome';
      setTimeout(()=> openLogin(), 260);
    }

    /***********************
     * Initialization
     ***********************/
    (async function init() {
      if (!localStorage.getItem('clientId')) {
        localStorage.setItem('clientId', 'client_' + Math.random().toString(36).substring(2, 15));
      }
      const restored = await restorePersistentSession();
      if (!restored) {
        restoreSessionUI();
        const session = getSession();
        if (session && session.username) {
          loadHomepage();
          startInactivityMonitoring();
        } else {
          frame.src = 'about:blank';
          titleEl.textContent = 'Welcome';
          pill.textContent = 'Please sign in';
          setTimeout(()=> { if (!getSession()) pill.textContent = 'Ready'; }, 1200);
          setTimeout(()=> openLogin(), 220);
        }
      }
      // Test connectivity
      apiGet('ping')
        .then(r => console.log('Server ping OK @', r.now))
        .catch(err => { console.error('Server ping failed', err); pill.textContent = 'Server unreachable'; setTimeout(()=> pill.textContent = 'Ready', 1600); });
    })();
  </script>
</body>
</html>
